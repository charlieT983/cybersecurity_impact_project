<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" > 
<!-- data-bs-theme dark does a dark theme for the website -->


<head>
   <title>Bootstrap Example</title>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">

   <!-- Using Bootstrap 5 framework -->
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
       rel="stylesheet">

   <!-- Bootstrap JavaScript -->
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

   <!-- jQuery used to load the navbar -->
   <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

   <!-- this allows for icons for the links -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

</head>


<body class="d-flex flex-column min-vh-100">

   <!-- Navbar gets added here -->
   <div id="nav-placeholder"></div>
   <!-- Web page content goes inside Bootstrap container(s) -->



   <!-- this is for the buttons to be able to scroll down to the specific information on this page. -->
<div class="d-flex flex-wrap gap-2">
      <a href="#phishing" class="btn btn-outline-light btn-lg fw-bold"><i class="bi bi-envelope-exclamation me-2" aria-hidden="true"></i>Phishing Scams</a>

     <script>
       // Load only the #site-nav element from navbar.html
       $("#nav-placeholder").load("navbar.html #site-nav");
   </script>
</body>

</html>
