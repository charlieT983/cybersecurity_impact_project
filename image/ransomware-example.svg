<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" font-family="Arial, Helvetica, sans-serif">
  <!-- example of a ransomware screen that locks your files and asks for money -->
  <rect x="0" y="0" width="800" height="560" fill="#1a1d20"/>
  <rect x="15" y="15" width="770" height="530" rx="10" fill="#2b0a0d" stroke="#dc3545" stroke-width="3"/>

  <!-- lock picture -->
  <path d="M340 110 v-28 a30 30 0 0 1 60 0 v28" fill="none" stroke="#ffc107" stroke-width="10"/>
  <rect x="325" y="108" width="90" height="70" rx="8" fill="#ffc107"/>
  <circle cx="370" cy="137" r="9" fill="#2b0a0d"/>
  <rect x="366" y="140" width="8" height="20" fill="#2b0a0d"/>

  <text x="370" y="225" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">YOUR FILES HAVE BEEN LOCKED!</text>
  <text x="370" y="262" font-size="19" fill="#f8d7da" text-anchor="middle">All of your photos, documents and files are encrypted.</text>

  <text x="370" y="310" font-size="22" fill="#ffffff" text-anchor="middle">To get them back, send <tspan font-weight="bold" fill="#ffc107">$500 in Bitcoin</tspan></text>
  <text x="370" y="340" font-size="19" fill="#f8d7da" text-anchor="middle">or gift cards to the address below.</text>

  <rect x="150" y="358" width="440" height="40" rx="4" fill="#000000" stroke="#6c757d"/>
  <text x="370" y="384" font-size="17" fill="#ffffff" text-anchor="middle" font-family="Courier New, monospace">1Fk9Xq2LmP8vR4tZ7wYb3Nc6Hd5Js</text>

  <text x="370" y="438" font-size="19" fill="#ffffff" text-anchor="middle">Time left before price doubles:</text>
  <text x="370" y="482" font-size="38" font-weight="bold" fill="#ff4d5a" text-anchor="middle" font-family="Courier New, monospace">71:59:42</text>
  <text x="370" y="520" font-size="17" fill="#f8d7da" text-anchor="middle">If you do not pay, your files will be DELETED forever.</text>

  <!-- yellow boxes around the warning signs -->
  <g fill="none" stroke="#ffc107" stroke-width="3" stroke-dasharray="8 5">
    <rect x="80" y="192" width="580" height="82" rx="6"/>
    <rect x="140" y="286" width="460" height="118" rx="6"/>
    <rect x="200" y="416" width="340" height="76" rx="6"/>
    <rect x="110" y="500" width="520" height="30" rx="6"/>
  </g>

  <!-- numbers that match the list on the page -->
  <g font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <circle cx="710" cy="233" r="18" fill="#dc3545" stroke="#ffffff" stroke-width="2"/><text x="710" y="240">1</text>
    <circle cx="710" cy="345" r="18" fill="#dc3545" stroke="#ffffff" stroke-width="2"/><text x="710" y="352">2</text>
    <circle cx="710" cy="454" r="18" fill="#dc3545" stroke="#ffffff" stroke-width="2"/><text x="710" y="461">3</text>
    <circle cx="710" cy="515" r="18" fill="#dc3545" stroke="#ffffff" stroke-width="2"/><text x="710" y="522">4</text>
  </g>
  <g stroke="#ffc107" stroke-width="3">
    <line x1="660" y1="233" x2="692" y2="233"/>
    <line x1="600" y1="345" x2="692" y2="345"/>
    <line x1="540" y1="454" x2="692" y2="454"/>
    <line x1="630" y1="515" x2="692" y2="515"/>
  </g>
</svg>
