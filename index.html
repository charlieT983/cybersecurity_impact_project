<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" > 
<!-- data-bs-theme dark does a dark theme for the website -->


<head>
   <title>Bootstrap Example</title>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">

   <!-- Using Bootstrap 5 framework -->
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
       rel="stylesheet">

   <!-- Bootstrap JavaScript -->
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

   <!-- jQuery used to load the navbar -->
   <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

   <!-- this allows for icons for the links -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

</head>



<!-- The d-flex + flex-column + min-vh-100 creates a full height vertical flex container -->
<body class="d-flex flex-column min-vh-100">

   <!-- Navbar gets added here -->
   <div id="nav-placeholder"></div>
   <!-- Web page content goes inside Bootstrap container(s) -->

<div class="container-sm-fluid p-5 my-5 bg-white text-black">
    <h1>The 3 common types of threats and how to spot them.</h1>


</div>


<!--- add button that goes to threat page and scrolls down to the specific information-->
<div class= "card" style= "width:400px">
    <img class="card-img-top" src="image/bank-of-scotland-phishing-scam.webp" alt="Phishing Scam example">
    
    <div class="card-body">
        <h4 class="card-title">Phishing Scam</h4>
        <p class="card-text">Phishing attacks can happen to anyone. </p>
        <button type="button" class="btn btn-primary active">More Info!</button>


    </div>

</div>





   <script>
       // Load only the #site-nav element from navbar.html
       $("#nav-placeholder").load("navbar.html #site-nav");
   </script>
</body>

</html>
